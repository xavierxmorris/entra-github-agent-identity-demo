name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore EntraGitHubAgentIdentityDemo.slnx
      - run: dotnet build EntraGitHubAgentIdentityDemo.slnx -c Release --no-restore
      - run: dotnet test EntraGitHubAgentIdentityDemo.slnx -c Release --no-build
      - run: dotnet build tools/DelegatedClient/DelegatedClient.csproj -c Release
      - name: Offline provisioning and policy-contract tests
        shell: pwsh
        run: ./scripts/Test-Scripts.ps1
      - name: Compile infrastructure
        run: az bicep build --file infra/main.bicep
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install checkov==3.3.19
      - name: Scan Bicep with resource-specific documented exceptions
        run: checkov -d infra --framework bicep --quiet
