name: Request synthetic maintenance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: agent-demo
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Exchange OIDC for Entra API authority, never for a GitHub write token
        shell: pwsh
        env:
          TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          CLIENT_ID: ${{ vars.CI_CLIENT_ID }}
          API_ID: ${{ vars.BROKER_API_ID }}
          BROKER_ORIGIN: ${{ vars.BROKER_ORIGIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($value in @($env:TENANT_ID, $env:CLIENT_ID, $env:API_ID)) {
            $id = [guid]::Empty
            if (-not [guid]::TryParseExact($value, 'D', [ref]$id) -or $id -eq [guid]::Empty) {
              throw 'Missing or invalid environment identity configuration.'
            }
          }
          $origin = [uri]$env:BROKER_ORIGIN
          if ($origin.Scheme -ne 'https' -or $origin.Port -ne 443 -or $origin.UserInfo -or
              $origin.Query -or $origin.Fragment -or $origin.AbsolutePath -ne '/' -or
              -not $origin.Host.EndsWith('.azurewebsites.net')) {
            throw 'Invalid broker origin.'
          }
          $oidc = Invoke-RestMethod -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=api%3A%2F%2FAzureADTokenExchange') `
            -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -TimeoutSec 30
          Write-Output "::add-mask::$($oidc.value)"
          $token = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/v2.0/token" `
            -ContentType 'application/x-www-form-urlencoded' -TimeoutSec 30 -Body @{
              client_id = $env:CLIENT_ID
              scope = "api://$env:API_ID/.default"
              grant_type = 'client_credentials'
              client_assertion_type = 'urn:ietf:params:oauth:client-assertion-type:jwt-bearer'
              client_assertion = $oidc.value
            }
          Write-Output "::add-mask::$($token.access_token)"
          $secure = ConvertTo-SecureString $token.access_token -AsPlainText -Force
          $requestId = [guid]::NewGuid().ToString('D')
          Write-Output "Request ID: $requestId"
          $body = @{ capabilityId = 'sandbox-maintenance'; requestId = $requestId } | ConvertTo-Json -Compress
          $url = $origin.AbsoluteUri.TrimEnd('/') + '/v1/maintenance-pr'
          $accepted = Invoke-WebRequest -Uri $url -Method Post -Body $body -ContentType 'application/json' `
            -Authentication Bearer -Token $secure -MaximumRedirection 0 -TimeoutSec 30 -SkipHttpErrorCheck
          if ($accepted.StatusCode -notin @(200, 202)) { throw "Admission rejected the operation: HTTP $($accepted.StatusCode)." }
          $operation = $accepted.Content | ConvertFrom-Json
          if ($operation.id -notmatch '^[a-f0-9]{64}$') { throw 'Invalid operation identifier.' }
          $statusUrl = $origin.AbsoluteUri.TrimEnd('/') + '/v1/operations/' + $operation.id
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(6)
          while ($operation.status -in @('pending', 'working', 'reconciling')) {
            if ([DateTimeOffset]::UtcNow -ge $deadline) { throw 'Operation status remains unresolved. Inspect the durable ledger; do not blindly resubmit with a new request ID.' }
            Start-Sleep -Seconds 5
            $response = Invoke-WebRequest -Uri $statusUrl -Authentication Bearer -Token $secure `
              -MaximumRedirection 0 -TimeoutSec 30 -SkipHttpErrorCheck
            if ($response.StatusCode -ne 200) { throw "Status request failed: HTTP $($response.StatusCode)." }
            $operation = $response.Content | ConvertFrom-Json
          }
          Write-Output "Operation $($operation.id): $($operation.status)"
          if ($operation.status -ne 'completed') { throw "Operation did not complete: $($operation.error)." }
          $pr = [uri]$operation.result.pullRequestUrl
          if ($pr.Scheme -ne 'https' -or $pr.Host -ne 'github.com') { throw 'Unexpected PR URL.' }
          Write-Output "Synthetic pull request: $($pr.AbsoluteUri)"
